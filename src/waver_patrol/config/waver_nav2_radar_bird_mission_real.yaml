mission_patrol_manager_node:
  ros__parameters:
    waypoint_file: "waypoints/waver_nav2_patrol_mission.yaml"
    nav2_action_name: "/navigate_to_pose"
    use_nav2: true
    resume_policy: "RETURN_TO_DEPARTURE_POSE"
    patrol_loop: true
    default_mode: "STANDBY"
    target_mission_timeout_sec: 120.0
    target_goal_tolerance_xy: 0.50
    target_arrival_tolerance_xy_m: 0.50
    target_re_detection_timeout_sec: 20.0
    target_classification_timeout_sec: 15.0
    camera_alignment_timeout_sec: 5.0
    min_classification_confidence: 0.50
    patrol_goal_timeout_sec: 180.0
    enable_sound_task: true
    enable_sound_output: false
    deterrence_classes: ["bird"]
    sound_task_timeout_sec: 15.0
    wait_bird_clear_after_sound: true
    target_departed_topic: "/waver/target_departed"
    bird_clear_timeout_sec: 20.0
    sound_cooldown_sec: 10.0
    bird_confidence_threshold: 0.70
    max_goal_retries: 2
    recovery_retry_count: 2
    ignore_new_target_during_mission: true
    frame_id: "map"
    base_frame: "base_link"
    global_frame: "map"

target_goal_manager_node:
  ros__parameters:
    global_frame: "map"
    base_frame: "base_link"
    use_tf_transform: true
    min_height_m: 3.0
    min_depth_m: 0.50
    max_depth_m: 30.0
    min_target_distance_m: 1.0
    max_target_distance_m: 20.0
    require_motion: true
    require_bird_confirmed: false
    allow_radar_without_bird_confirmed: false
    require_3d_fusion_valid: true
    mission_target_policy: "lidar_first_inspection"
    allow_lidar_dynamic_without_bird_confirmed_for_inspection: true
    require_bird_confirmed_for_inspection_goal: false
    require_bird_confirmed_for_sound: true
    require_3d_lidar_z_valid_for_inspection: true
    require_dynamic_valid_for_inspection: true
    require_camera_classification_before_sound: true
    deterrence_classes: ["bird"]
    non_deterrence_classes: ["drone", "unknown", "irrelevant", "none"]
    inspection_goal_offset_distance_m: 2.0
    classification_standoff_distance_m: 2.0
    target_arrival_tolerance_xy_m: 0.5
    inspection_cooldown_sec: 8.0
    max_inspection_retries_per_target: 1
    inspected_target_lockout_sec: 120.0
    inspected_target_radius_m: 1.5
    enforce_mode_gate: true
    allowed_trigger_modes: ["PATROL", "AUTO", "BIRD_CANDIDATE"]
    goal_offset_distance_m: 2.0
    goal_publish_cooldown_sec: 3.0
    target_hold_sec: 1.0
    target_lost_timeout_sec: 2.0
    target_pose_stale_timeout_sec: 3.0
    robot_pose_stale_timeout_sec: 2.0
    goal_yaw_policy: "FACE_TARGET"
    robot_pose_topic: "/amcl_pose"
    robot_odom_topic: "/odom"
    require_robot_pose_for_goal: true
    bird_target_valid_topic: "/waver/bird_target_valid"
    bird_target_pose_map_topic: "/waver/bird_target_pose_map"
    elevated_dynamic_targets_topic: "/waver/elevated_dynamic_targets"
    subscribe_raw_lidar_objects: false
    subscribe_lidar_objects_map: false

moving_object_motion_filter_node:
  ros__parameters:
    input_topic: "/waver/lidar_objects_map"
    raw_input_topic: "/waver/lidar_objects"
    target_min_height_m: 3.0
    target_max_height_m: 30.0
    height_reference_frame: "map"
    fallback_height_reference_frame: "odom"
    ground_z_offset_m: 0.0
    require_z_valid: true
    require_height_filter: true
    require_dynamic_filter: true
    min_dynamic_motion_m: 0.2
    min_dynamic_velocity_mps: 0.05
    min_sample_motion_epsilon_m: 0.005
    lock_on_first_valid_target: true
    locked_target_gate_m: 1.0
    locked_target_lost_timeout_sec: 3.0
    clear_locked_target_when_static_sec: 8.0
    min_tracking_duration_sec: 1.0
    max_tracking_duration_sec: 20.0
    require_consecutive_dynamic_frames: 5
    static_motion_tolerance_m: 0.25
    high_yaw_rate_mode: "strict_validation"
    angular_velocity_threshold_radps: 0.25
    max_target_distance_m: 20.0
    min_target_distance_m: 0.5
    z_source_mode: "pointcloud"
    require_3d_z_source: true
    disable_triggers_in_mapping_mode: true

livox_pointcloud_to_scan_node:
  ros__parameters:
    pointcloud_topic: "/mid360_PointCloud2"
    scan_topic: "/scan"
    state_topic: "/waver/livox_scan_adapter_state"
    forward_axis: "x"
    lateral_axis: "y"
    height_axis: "z"
    positive_lateral_is_left: true
    obstacle_min_height_m: -0.35
    obstacle_max_height_m: 0.80
    range_min_m: 0.08
    range_max_m: 12.0
    angle_increment_rad: 0.0174533
    max_points: 60000
    min_raw_points: 50
    min_used_points: 10

pointcloud_lidar_objects_node:
  ros__parameters:
    pointcloud_topic: "/mid360_PointCloud2"
    output_pose_array_topic: "/waver/lidar_objects"
    state_topic: "/waver/lidar_objects_state"
    target_frame: "base_link"
    forward_axis: "x"
    lateral_axis: "y"
    height_axis: "z"
    positive_lateral_is_left: true
    require_tf: true
    min_height_m: 0.35
    max_height_m: 30.0
    min_depth_m: 0.2
    max_depth_m: 30.0
    voxel_leaf_size_m: 0.20
    cluster_eps_m: 0.55
    cluster_min_points: 4
    max_points: 30000
    remove_robot_body: true
    self_x_min: -0.7
    self_x_max: 0.7
    self_y_min: -0.7
    self_y_max: 0.7
    self_z_min: -0.4
    self_z_max: 0.9

bird_detector_node:
  ros__parameters:
    real_profile: true
    image_topic: "/camera/image_raw"
    camera_info_topic: "/camera/camera_info"
    detections_topic: "/waver/bird_detections_2d"
    confirmed_topic: "/waver/bird_confirmed"
    state_topic: "/waver/bird_detector_state"
    target_class_topic: "/waver/target_class"
    target_confidence_topic: "/waver/target_confidence"
    target_classification_state_topic: "/waver/target_classification_state"
    target_classification_latency_topic: "/waver/target_classification_latency_ms"
    backend: "yolo"
    bird_backend: "yolo"
    model_path: ""
    bird_model_path: ""
    detector_required_for_real: true
    max_detector_latency_sec: 1.0
    accepted_bird_classes: ["bird"]
    non_bird_classes: ["person", "vehicle", "robot", "drone", "irrelevant", "none"]
    confidence_threshold: 0.65
    bird_class_names: ["bird"]
    class_names_of_interest: ["bird", "drone"]
    deterrence_class_names: ["bird"]
    unknown_confidence_threshold: 0.50
    class_aliases: ["airplane:irrelevant", "kite:unknown", "bird:bird", "drone:drone", "uav:drone"]
    publish_unknown_when_no_detection: true
    classification_requires_camera_alignment: true
    camera_centered_topic: "/waver/camera_target_centered"
    nof_m_window: 5
    nof_m_required: 3
    camera_stale_sec: 1.0
    min_bbox_area_fraction: 0.001
    max_bbox_area_fraction: 0.8
    edge_margin_fraction: 0.05
    max_inference_hz: 10.0

bird_3d_fusion_node:
  ros__parameters:
    detections_topic: "/waver/bird_detections_2d"
    bird_confirmed_topic: "/waver/bird_confirmed"
    camera_info_topic: "/camera/camera_info"
    pointcloud_topic: "/mid360_PointCloud2"
    moving_target_valid_topic: "/waver/moving_target_valid"
