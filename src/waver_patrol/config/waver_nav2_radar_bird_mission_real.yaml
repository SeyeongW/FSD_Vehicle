    global_frame: "map"
    min_points_in_bbox: 5
    max_points: 60000
    min_height_m: 3.0
    max_height_m: 30.0
    ground_z_offset_m: 0.0
    min_range_m: 1.0
    max_range_m: 30.0
    require_dynamic_valid: true
    dynamic_association_radius_m: 1.5
    max_dynamic_target_age_sec: 1.0
    max_sync_dt_sec: 0.25
    require_camera_optical_frame: true

camera_gimbal_controller_node:
  ros__parameters:
    camera_mount_frame: "camera_link"
