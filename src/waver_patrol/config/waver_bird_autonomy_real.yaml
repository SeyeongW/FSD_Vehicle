real_vehicle:
  ros__parameters:
    real_profile: true
    default_mode: "STANDBY"
    enable_test_publishers: false
    enable_deep_learning_stub: false
    enable_bird_detector: true
    enable_bird_3d_fusion: true
    enable_livox_scan_adapter: true
    enable_pointcloud_lidar_objects: true
    enable_moving_object_map_transform: true
    enable_moving_object_motion_filter: true
    start_serial_bridge: false
    include_existing_ugv_driver: false
    require_scan: true
    start_patrol_requires_operator: true
    camera_only_goal_allowed: false
    mapping_mode_target_interrupt_enabled: false
    safety_max_linear_speed: 0.10
    safety_max_angular_speed: 0.35

bird_autonomy_policy:
  ros__parameters:
    require_bird_confirmed: true
    require_3d_fusion_valid: true
    require_dynamic_valid: true
    require_z_valid: true
    min_target_height_m: 3.0
    allow_laserscan_only_height: false
    allow_radar_without_bird_confirmed: false
    allowed_trigger_modes: ["PATROL", "AUTO", "BIRD_CONFIRMED"]
    blocked_modes: ["STANDBY", "MAPPING_AUTO", "MAPPING_MANUAL", "EMERGENCY"]
