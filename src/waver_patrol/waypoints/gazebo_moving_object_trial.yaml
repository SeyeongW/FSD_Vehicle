frame_id: "map"
route_name: "gazebo_moving_object_trial"
loop: true
experiment_tags: ["gazebo", "height_3m_dynamic_target", "mission_resume"]

# Gazebo smoke-test coordinates only. Real Waver waypoints must be measured in
# the saved SLAM map before field testing.
home:
  name: "home"
  x: 0.0
  y: 0.0
  yaw_deg: 0.0

charge:
  name: "charge"
  x: 0.0
  y: -0.5
  yaw_deg: 180.0

waypoints:
  - name: "trial_wp_1"
    x: 0.8
    y: 0.0
    yaw_deg: 0.0
    dwell_s: 1.0
    task: ["observe"]
  - name: "trial_wp_2"
    x: 0.8
    y: 0.5
    yaw_deg: 90.0
    dwell_s: 1.0
    task: ["observe"]
  - name: "trial_wp_3"
    x: 0.1
    y: 0.5
    yaw_deg: 180.0
    dwell_s: 1.0
    task: ["observe"]

failure_policy:
  nav2_goal_failed: "RETRY_THEN_SKIP"
  max_retries_per_goal: 1
  target_goal_failed: "RETURN_TO_INTERRUPTED_WAYPOINT"
  battery_critical: "RETURN_CHARGE"
  emergency_stop: "CANCEL_ALL_GOALS"
