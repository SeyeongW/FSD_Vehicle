# Odom-frame 1 m square around the current start pose. Edit these coordinates
# at the real field after confirming /odom or localization origin, axes, and
# safe clearances.
route_name: "waver_bird_patrol_1m_square"
frame_id: "odom"
loop_count: -1
home:
  name: "home"
  x: 0.0
  y: 0.0
  yaw_deg: 0.0
charge:
  name: "charge"
  x: 0.0
  y: -0.4
  yaw_deg: 180.0
waypoints:
  - name: "square_origin"
    x: 0.0
    y: 0.0
    yaw_deg: 0.0
    dwell_s: 1.0
  - name: "square_east_1m"
    x: 1.0
    y: 0.0
    yaw_deg: 90.0
    dwell_s: 1.0
  - name: "square_north_east_1m"
    x: 1.0
    y: 1.0
    yaw_deg: 180.0
    dwell_s: 1.0
  - name: "square_north_1m"
    x: 0.0
    y: 1.0
    yaw_deg: -90.0
    dwell_s: 1.0
failure_policy:
  waypoint_retry: 2
  skip_after_retry: true
  return_home_after_skips: 3
  emergency_stop_on_repeated_recovery: true
