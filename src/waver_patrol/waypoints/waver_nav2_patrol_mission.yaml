frame_id: "map"
route_name: "waver_1m_square_patrol"
loop: true
experiment_tags: ["bird_deterrence", "radar_guided", "nav2_patrol", "1m_square_patrol", "low_speed_real_ready"]

# 1 m x 1 m map-frame square starting from the current patrol origin.
# Measure and edit the origin after real SLAM/localization are stable at the field.
home:
  name: "home"
  x: 0.0
  y: 0.0
  yaw_deg: 0.0

charge:
  name: "charge"
  x: 0.0
  y: 0.0
  yaw_deg: 180.0

waypoints:
  - name: "square_origin"
    x: 0.0
    y: 0.0
    yaw_deg: 0.0
    dwell_s: 2.0
    task: ["observe"]
  - name: "square_east_1m"
    x: 1.0
    y: 0.0
    yaw_deg: 90.0
    dwell_s: 2.0
    task: ["observe"]
  - name: "square_north_east_1m"
    x: 1.0
    y: 1.0
    yaw_deg: 180.0
    dwell_s: 2.0
    task: ["observe"]
  - name: "square_north_1m"
    x: 0.0
    y: 1.0
    yaw_deg: -90.0
    dwell_s: 2.0
    task: ["observe"]

failure_policy:
  nav2_goal_failed: "RETRY_THEN_SKIP"
  max_retries_per_goal: 2
  target_goal_failed: "RETURN_TO_INTERRUPTED_WAYPOINT"
  battery_critical: "RETURN_CHARGE"
  emergency_stop: "CANCEL_ALL_GOALS"
