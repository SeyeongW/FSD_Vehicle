frame_id: "map"
route_name: "waver_3m_square_patrol"
loop: true
experiment_tags: ["bird_deterrence", "radar_guided", "nav2_patrol", "3m_square_patrol"]

# 3 m x 3 m map-frame square around the start pose. Measure and edit these
# coordinates after real SLAM/localization are stable at the field.
home:
  name: "home"
  x: 0.0
  y: 0.0
  yaw_deg: 0.0

charge:
  name: "charge"
  x: -1.5
  y: -1.5
  yaw_deg: 180.0

waypoints:
  - name: "square_sw"
    x: -1.5
    y: -1.5
    yaw_deg: 0.0
    dwell_s: 2.0
    task: ["observe"]
  - name: "square_se"
    x: 1.5
    y: -1.5
    yaw_deg: 90.0
    dwell_s: 2.0
    task: ["observe"]
  - name: "square_ne"
    x: 1.5
    y: 1.5
    yaw_deg: 180.0
    dwell_s: 2.0
    task: ["observe"]
  - name: "square_nw"
    x: -1.5
    y: 1.5
    yaw_deg: -90.0
    dwell_s: 2.0
    task: ["observe"]

failure_policy:
  nav2_goal_failed: "RETRY_THEN_SKIP"
  max_retries_per_goal: 2
  target_goal_failed: "RETURN_TO_INTERRUPTED_WAYPOINT"
  battery_critical: "RETURN_CHARGE"
  emergency_stop: "CANCEL_ALL_GOALS"
