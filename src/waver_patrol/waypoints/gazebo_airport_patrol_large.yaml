frame_id: "map"
route_name: "gazebo_airport_patrol_3m_square"
loop: true
experiment_tags: ["gazebo", "ugv_world", "3m_square_patrol", "dynamic_obstacle", "elevated_target"]

# Gazebo airport-world patrol coordinates.
# The route forms a 3 m x 3 m square centered around the start pose:
#   southwest -> southeast -> northeast -> northwest -> loop.
# Keep this small until SLAM/localization and safety mux are verified.
home:
  name: "home"
  x: 0.0
  y: 0.0
  yaw_deg: 0.0

charge:
  name: "charge"
  x: -1.5
  y: -1.5
  yaw_deg: 180.0

waypoints:
  - name: "square_sw"
    x: -1.5
    y: -1.5
    yaw_deg: 0.0
    dwell_s: 1.0
    task: ["observe"]
  - name: "square_se"
    x: 1.5
    y: -1.5
    yaw_deg: 90.0
    dwell_s: 1.0
    task: ["observe"]
  - name: "square_ne"
    x: 1.5
    y: 1.5
    yaw_deg: 180.0
    dwell_s: 1.0
    task: ["observe"]
  - name: "square_nw"
    x: -1.5
    y: 1.5
    yaw_deg: -90.0
    dwell_s: 1.0
    task: ["observe"]

failure_policy:
  nav2_goal_failed: "RETRY_THEN_SKIP"
  max_retries_per_goal: 1
  target_goal_failed: "RETURN_TO_INTERRUPTED_WAYPOINT"
  battery_critical: "RETURN_CHARGE"
  emergency_stop: "CANCEL_ALL_GOALS"
