frame_id: "map"
route_name: "waver_real_0p5m_square_patrol"
loop: true
experiment_tags: ["real_low_speed", "nav2_patrol", "0p5m_square", "lidar_ready"]

# Low-speed real-vehicle starter route.
# Use this only after map/localization/scan/odom checks pass.
# Edit the origin in map coordinates after the real map is fixed.
home:
  name: "home"
  x: 0.0
  y: 0.0
  yaw_deg: 0.0

charge:
  name: "charge"
  x: 0.0
  y: 0.0
  yaw_deg: 180.0

waypoints:
  - name: "square_origin"
    x: 0.0
    y: 0.0
    yaw_deg: 0.0
    dwell_s: 1.0
    task: ["observe"]
  - name: "square_east_0p5m"
    x: 0.5
    y: 0.0
    yaw_deg: 90.0
    dwell_s: 1.0
    task: ["observe"]
  - name: "square_north_east_0p5m"
    x: 0.5
    y: 0.5
    yaw_deg: 180.0
    dwell_s: 1.0
    task: ["observe"]
  - name: "square_north_0p5m"
    x: 0.0
    y: 0.5
    yaw_deg: -90.0
    dwell_s: 1.0
    task: ["observe"]

failure_policy:
  nav2_goal_failed: "RETRY_THEN_SKIP"
  max_retries_per_goal: 1
  target_goal_failed: "RETURN_TO_INTERRUPTED_WAYPOINT"
  battery_critical: "RETURN_CHARGE"
  emergency_stop: "CANCEL_ALL_GOALS"
